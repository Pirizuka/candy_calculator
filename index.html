<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Candy Shop Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: inventory + feeder on the left, weekly recipes on the right, the plan full width underneath; one column on phones. */
:root{
  --bg:#e8eaf1; --surface:#f6f7fb; --well:#e9ecf4; --line:#d3d8e5; --fg:#1b1f2f; --muted:#596079;
  --accent:#d65f28; --accent-ink:#ffffff;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 10px 28px -18px rgba(28,34,64,.35);
  --float:0 16px 36px -10px rgba(20,26,56,.4);
  --cedge:rgba(20,24,50,.14); --hi:rgba(255,255,255,.5);
  --g-top:#6fd18e; --g-bot:#37a05a;
  --w-top:#ffffff; --w-bot:#d9dcea;
  --p-top:#a67df0; --p-bot:#7345c1;
  --b-top:#69abff; --b-bot:#2e75d8;
  --k-top:#4f5266; --k-bot:#1e1f29;
  --ink:#ffffff; --ink-w:#4b5169;
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12141c; --surface:#1b1e2a; --well:#141720; --line:#2c3144; --fg:#e8eaf3; --muted:#9097ad;
    --accent:#f0874f; --accent-ink:#1b1008;
    --shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 10px 28px -18px rgba(0,0,0,.8);
    --float:0 16px 36px -10px rgba(0,0,0,.7);
    --cedge:rgba(255,255,255,.16); --hi:rgba(255,255,255,.28);
    --g-top:#5ccf80; --g-bot:#2c8c4e;
    --w-top:#f4f5fb; --w-bot:#c5c9de;
    --p-top:#a883f0; --p-bot:#6a3db6;
    --b-top:#62a2fa; --b-bot:#2a6dcb;
    --k-top:#3d4053; --k-bot:#0c0d12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12141c; --surface:#1b1e2a; --well:#141720; --line:#2c3144; --fg:#e8eaf3; --muted:#9097ad;
  --accent:#f0874f; --accent-ink:#1b1008;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 10px 28px -18px rgba(0,0,0,.8);
  --float:0 16px 36px -10px rgba(0,0,0,.7);
  --cedge:rgba(255,255,255,.16); --hi:rgba(255,255,255,.28);
  --g-top:#5ccf80; --g-bot:#2c8c4e;
  --w-top:#f4f5fb; --w-bot:#c5c9de;
  --p-top:#a883f0; --p-bot:#6a3db6;
  --b-top:#62a2fa; --b-bot:#2a6dcb;
  --k-top:#3d4053; --k-bot:#0c0d12;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-inline:clamp(16px,4vw,32px);padding-block:28px 56px}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:1080px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
header .intro{min-width:0;flex:1 1 360px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.7rem,4.5vw,2.3rem);letter-spacing:-.025em;line-height:1.1;margin:0 0 6px;text-wrap:balance}
.sub{margin:0;color:var(--muted);max-width:62ch}
h2{font-family:var(--font-display);font-weight:650;font-size:1.1rem;letter-spacing:-.01em;margin:0}
.label{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

.layout{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (min-width:980px){
  .layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .plan{grid-column:1/-1}
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);min-width:0}
.panel.compact{padding:14px 18px}
.panel-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:12px}
.panel-head .meta{display:flex;align-items:center;gap:10px}
.fill-count{font-family:var(--font-mono);font-weight:600;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{margin:10px 0 0;font-size:.85rem;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.5rem .85rem;font-weight:600;font-size:.88rem;cursor:pointer;transition:background .12s,transform .12s}
.btn:hover{background:var(--well)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding-inline:.5rem}
.btn.ghost:hover{background:var(--well);color:var(--fg)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* candies */
.c0{--top:var(--g-top);--bot:var(--g-bot);--tag:var(--ink)}
.c1{--top:var(--w-top);--bot:var(--w-bot);--tag:var(--ink-w)}
.c2{--top:var(--p-top);--bot:var(--p-bot);--tag:var(--ink)}
.c3{--top:var(--b-top);--bot:var(--b-bot);--tag:var(--ink)}
.c4{--top:var(--k-top);--bot:var(--k-bot);--tag:var(--ink)}
.candy{background:linear-gradient(155deg,var(--top),var(--bot));border:1px solid var(--cedge);color:var(--tag);
  box-shadow:inset 0 2px 2px var(--hi),inset 0 -4px 8px rgba(0,0,0,.16),0 3px 6px -2px rgba(20,26,56,.35)}
.tag{font-family:var(--font-mono);font-weight:700;font-size:clamp(.72rem,2.3vw,.95rem);letter-spacing:0;opacity:.95;pointer-events:none}

.cell{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:1;padding:0;border-radius:28%;cursor:pointer;
  transition:transform .12s ease}
.cell.empty{background:var(--well);border:1.5px dashed var(--line);cursor:default}
button.cell.candy:hover{transform:translateY(-2px) scale(1.04)}
.pop{animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.55);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.cell,.btn{transition:none}}

.grid-inv{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:clamp(4px,1vw,7px);max-width:560px}
.grid-inv .candy::after,.tgrid .candy::after{content:"\00d7";position:absolute;inset:0;display:grid;place-items:center;border-radius:inherit;
  background:rgba(10,12,24,.5);color:#fff;font-size:1.4rem;opacity:0;transition:opacity .12s}
.grid-inv .candy:hover::after,.grid-inv .candy:focus-visible::after,.tgrid .candy:hover::after,.tgrid .candy:focus-visible::after{opacity:1}

.counts{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px}
.counts li{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.counts .sw{width:14px;height:14px;border-radius:30%;box-shadow:none}
.counts .n{font-family:var(--font-mono);font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums;min-width:1.2ch;text-align:right}

.feeder{display:flex;flex-wrap:wrap;gap:10px 14px}
.feed{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;cursor:pointer;width:56px}
.feed .cell{pointer-events:none}
.feed:hover .cell{transform:translateY(-2px) scale(1.05)}
.feed span.nm{font-size:.74rem;color:var(--muted);text-transform:capitalize}
.feed:disabled{opacity:.4;cursor:not-allowed}
.feed:disabled:hover .cell{transform:none}

/* recipes */
.rgrid{display:grid;grid-template-columns:1.5rem repeat(4,minmax(0,1fr)) 1.3rem repeat(4,minmax(0,1fr));gap:clamp(4px,1vw,7px);align-items:center;max-width:560px}
.rhead{margin-bottom:6px}
.rhead .label{text-align:left}
.recipes{display:flex;flex-direction:column;gap:12px}
.rnum{font-family:var(--font-mono);font-weight:600;color:var(--muted);font-size:.85rem;text-align:center}
.arrow{color:var(--muted);justify-self:center;width:1.1rem;height:1.1rem}
.slot.empty{background:var(--well);border:1.5px dashed var(--line)}
.slot.empty::before{content:"+";color:var(--muted);font-size:1.1rem;opacity:.7}
.slot.empty:hover{border-color:var(--accent);transform:translateY(-1px)}

#picker{position:fixed;z-index:50;display:flex;gap:8px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--float)}
#picker[hidden]{display:none}
.pk{width:42px;height:42px;border-radius:28%;display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .1s}
.pk:hover{transform:translateY(-2px) scale(1.06)}
.pk.none{background:var(--well);border:1.5px dashed var(--line);color:var(--muted);font-size:1.2rem}
.pk.sel{outline:2px solid var(--accent);outline-offset:2px}

/* plan */
.plan-controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-bottom:6px}
/* amount view: one generic 5-colour counter used for inventory, recipe sides and target */
[hidden]{display:none!important}
.hdr-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.amt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px clamp(6px,2vw,14px);max-width:400px}
.acol{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;user-select:none;-webkit-user-select:none}
.acol .cell{max-width:56px;font-family:var(--font-mono);font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums}
.acol .cell.zero{opacity:.45;filter:saturate(.5)}
.acol .nm{font-size:.74rem;color:var(--muted);text-transform:capitalize;max-width:100%;overflow-wrap:anywhere;text-align:center}
.stp{display:grid;place-items:center;width:100%;max-width:56px;height:24px;border:0;background:transparent;color:var(--muted);border-radius:8px;cursor:pointer;padding:0}
.stp:hover:not(:disabled){background:var(--well);color:var(--fg)}
.stp:disabled{opacity:.25;cursor:not-allowed}
.amt.compact{max-width:none;gap:2px clamp(2px,1vw,8px)}
.amt.compact .cell{font-size:1.25rem}
.amt.compact .nm{font-size:.66rem}
.amt.compact .stp{height:20px}
.arow{display:grid;grid-template-columns:1.5rem minmax(0,1fr) 1.3rem minmax(0,1fr);gap:6px;align-items:center}
.arow .arrow{justify-self:center}
.agroup::before{display:none;content:attr(data-label);margin-bottom:2px;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ahead{margin-bottom:-4px}
@media (max-width:560px){
  .arow{grid-template-columns:1.5rem minmax(0,1fr)}
  .arow .arrow{transform:rotate(90deg)}
  .ahead{display:none}
  .agroup::before{display:block}
  .amt .stp{height:34px;max-width:none}
  .amt.compact .stp{height:32px}
  .amt .stp svg{width:24px;height:24px}
}
.seg{position:relative;display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--well)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:.45rem .8rem;font-size:.86rem;font-weight:600;cursor:pointer;color:var(--muted)}
.seg input:checked+label{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--accent);border-radius:9px}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-2px}
.target{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.tgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(4px,1vw,7px);max-width:340px}
.tneeds{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.85rem;color:var(--muted)}
.status{min-height:1.4em;margin:8px 0 0;font-size:.88rem;color:var(--muted)}
.result{margin-top:16px;display:flex;flex-direction:column;gap:16px}
.ba{display:flex;flex-wrap:wrap;gap:10px 28px}
.ba>div{display:flex;flex-direction:column;gap:6px}
.stats{font-family:var(--font-mono);font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums}
.tally{display:inline-flex;gap:4px}
.mini{width:32px;height:32px;border-radius:28%;display:grid;place-items:center;font-family:var(--font-mono);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums;box-shadow:none}
.mini.zero{opacity:.3;filter:saturate(.3)}
.seqbox{background:var(--well);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:var(--font-mono);font-size:.82rem;line-height:1.7;overflow-wrap:anywhere;user-select:text}
.actions{display:flex;flex-wrap:wrap;gap:8px}
ol.steps{list-style:none;margin:0;padding:0}
ol.steps li{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;align-items:center;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line)}
.idx{font-family:var(--font-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.what{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-width:0}
.what strong{font-weight:600}
.eq{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.dots{display:inline-flex;gap:3px}
.dot{width:14px;height:14px;border-radius:30%;box-shadow:none;display:inline-block}
.times{font-family:var(--font-mono);font-weight:600;font-size:.8rem;background:var(--well);border:1px solid var(--line);border-radius:999px;padding:0 .5rem}
.empty-note{margin:16px 0 0;color:var(--muted);font-size:.92rem}
@media (max-width:560px){
  ol.steps li{grid-template-columns:2rem minmax(0,1fr)}
  ol.steps li .after{grid-column:2}
}
</style>

<main class="app">
  <header>
    <div class="intro">
      <h1>Candy Shop Planner</h1>
      <p class="sub">Plan the best crafts for this week's candy recipes.</p>
    </div>
    <div class="hdr-tools">
      <div class="seg" role="radiogroup" aria-label="Input style">
        <input type="radio" name="view" id="view-grid" value="grid" checked><label for="view-grid">Grid</label>
        <input type="radio" name="view" id="view-amount" value="amount"><label for="view-amount">Amount</label>
      </div>
    </div>
  </header>

  <div class="layout">
    <div class="stack">
      <section class="panel" aria-labelledby="inv-title">
        <div class="panel-head">
          <h2 id="inv-title">Inventory</h2>
          <div class="meta">
            <span class="fill-count" id="fill-count">0 / 30</span>
            <button type="button" class="btn ghost" id="clear-inv">Clear</button>
          </div>
        </div>
        <div class="grid-inv" id="inv-grid"></div>
        <ul class="counts" id="counts" aria-label="Candies by type"></ul>
        <div id="inv-amt" hidden></div>
        <p class="hint" id="inv-hint"></p>
      </section>

      <section class="panel compact" id="feed-panel" aria-labelledby="feed-title">
        <div class="panel-head" style="margin-bottom:10px">
          <h2 id="feed-title">Add candy</h2>
        </div>
        <div class="feeder" id="feeder"></div>
      </section>
    </div>

    <section class="panel" aria-labelledby="rec-title">
      <div class="panel-head">
        <h2 id="rec-title">This week's recipes</h2>
        <button type="button" class="btn ghost" id="clear-rec">Clear recipes</button>
      </div>
      <div class="rgrid rhead" id="rhead" aria-hidden="true">
        <span></span><span class="label" style="grid-column:2 / span 4">Ingredients</span><span></span><span class="label" style="grid-column:7 / span 4">Results</span>
      </div>
      <div class="recipes" id="recipes"></div>
      <p class="hint" id="rec-hint"></p>
    </section>

    <section class="panel plan" aria-labelledby="plan-title">
      <div class="panel-head" style="margin-bottom:8px">
        <h2 id="plan-title">Plan</h2>
      </div>
      <div class="plan-controls">
        <div class="seg" role="radiogroup" aria-label="Goal">
          <input type="radio" name="mode" id="mode-target" value="target" checked><label for="mode-target">Target</label>
          <input type="radio" name="mode" id="mode-fill" value="fill"><label for="mode-fill">Fill first</label>
        </div>
        <button type="button" class="btn primary" id="solve">Find best sequence</button>
      </div>
      <p class="hint" id="mode-hint" style="margin-top:4px"></p>
      <div class="target" id="target-box" hidden>
        <div class="panel-head" style="margin-bottom:0">
          <span class="label">Target recipe</span>
          <div class="meta">
            <span class="fill-count" id="target-count">0 / 18</span>
            <button type="button" class="btn ghost" id="clear-target">Clear</button>
          </div>
        </div>
        <div class="tgrid" id="target-grid"></div>
        <div id="target-amt" hidden></div>
        <div class="feeder" id="target-feeder"></div>
        <div class="tneeds" id="target-needs"></div>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="result" id="result" hidden></div>
      <p class="empty-note" id="plan-empty">Add your candies and recipes, then find the best sequence.</p>
    </section>
  </div>
</main>

<div id="picker" hidden role="menu" aria-label="Choose a candy"></div>

<script>
// SOLVER-START
function solveCandies(start, recipes, mode, cap, need){
  var T=[], a, b, c, r, i, k, tgt=(mode==='target');
  if(!need) need=[0,0,0,0,0];
  for(i=0;i<recipes.length;i++) T.push({kind:'s', n:recipes[i].n, inp:recipes[i].inp, out:recipes[i].out});
  for(a=0;a<5;a++) for(b=a;b<5;b++) for(c=b;c<5;c++){
    for(r=0;r<5;r++){
      var inp=[0,0,0,0,0], out=[0,0,0,0,0];
      inp[a]++; inp[b]++; inp[c]++; out[r]=1;
      T.push({kind:'g', n:0, inp:inp, out:out});
    }
  }
  var nT=T.length, M=[1,31,961,29791,923521];
  var inpA=new Int8Array(nT*5), outA=new Int8Array(nT*5), dk=new Int32Array(nT), net=new Int8Array(nT);
  for(i=0;i<nT;i++){
    var d=0, s=0;
    for(k=0;k<5;k++){ inpA[i*5+k]=T[i].inp[k]; outA[i*5+k]=T[i].out[k]; d+=(T[i].out[k]-T[i].inp[k])*M[k]; s+=T[i].out[k]-T[i].inp[k]; }
    dk[i]=d; net[i]=s;
  }
  var MAXN=330000;
  var counts=new Uint8Array(MAXN*5), keys=new Int32Array(MAXN), tot=new Uint8Array(MAXN);
  var parent=new Int32Array(MAXN), act=new Int16Array(MAXN), depth=new Uint16Array(MAXN);
  var seen=new Map(), n=0;
  function shortfall(idx){
    var base=idx*5, s=0, d;
    for(var q=0;q<5;q++){ d=need[q]-counts[base+q]; if(d>0) s+=d; }
    return s;
  }
  function score(idx){
    /* fill first: most candies, then the most even mix */
    var base=idx*5, sq=0, v;
    for(var q=0;q<5;q++){ v=counts[base+q]; sq+=v*v; }
    return tot[idx]*10000-sq;
  }
  var key0=0, t0=0;
  for(k=0;k<5;k++){ counts[k]=start[k]; key0+=start[k]*M[k]; t0+=start[k]; }
  keys[0]=key0; tot[0]=t0; parent[0]=-1; act[0]=-1; seen.set(key0,0); n=1;
  var best=0, bestScore=tgt?0:score(0), bestShort=tgt?shortfall(0):0;
  search:
  for(var qi=0; qi<n && !(tgt&&bestShort===0); qi++){
    var base=qi*5, tq=tot[qi];
    for(var t=0;t<nT;t++){
      if(tq+net[t]>cap) continue;
      var ok=true, tb=t*5, cv, fl;
      for(k=0;k<5;k++){
        cv=counts[base+k];
        if(cv<inpA[tb+k]){ ok=false; break; }
        if(tgt){
          /* a type that already covers the target is never spent below the target amount;
             a type that is short may be spent freely as an intermediate */
          fl=cv>=need[k]?need[k]:0;
          if(cv-inpA[tb+k]+outA[tb+k]<fl){ ok=false; break; }
        }
      }
      if(!ok) continue;
      var nk=keys[qi]+dk[t];
      if(seen.has(nk)) continue;
      var ni=n++, nb=ni*5;
      for(k=0;k<5;k++) counts[nb+k]=counts[base+k]-inpA[tb+k]+outA[tb+k];
      keys[ni]=nk; tot[ni]=tq+net[t]; parent[ni]=qi; act[ni]=t; depth[ni]=depth[qi]+1; seen.set(nk,ni);
      if(tgt){
        var sh=shortfall(ni);
        if(sh<bestShort || (sh===bestShort && depth[ni]===depth[best] && tot[ni]>tot[best])){ bestShort=sh; best=ni; }
        if(bestShort===0) break search;
      }else{
        var sc=score(ni);
        if(sc>bestScore){ bestScore=sc; best=ni; }
      }
    }
  }
  var path=[], cur=best;
  while(parent[cur]!==-1){ path.push(act[cur]); cur=parent[cur]; }
  path.reverse();
  var state=start.slice(), steps=[];
  for(i=0;i<path.length;i++){
    var x=T[path[i]];
    for(k=0;k<5;k++) state[k]=state[k]-x.inp[k]+x.out[k];
    steps.push({kind:x.kind, n:x.n, inp:x.inp, out:x.out, after:state.slice()});
  }
  return {steps:steps, final:state, explored:n};
}

  function applyResult(){
    var f=result.sol.final, list=[];
    f.forEach(function(c,t){ for(var q=0;q<c;q++) list.push(t); });
    state.inv=list; lastAdded=-1; renderInv(); save();
    result=null; resultEl.hidden=true; resultEl.innerHTML=''; planEmpty.hidden=false;
    statusEl.textContent='Inventory updated.';
  }
  solveBtn.addEventListener('click',function(){
    if(!state.inv.length){ statusEl.textContent='Add some candies first.'; return; }
    var start=countsOf(state.inv), rs=[];
    state.recipes.forEach(function(r,i){
      var inp=vec(r.inp), out=vec(r.out);
      if(sum(inp)>0&&sum(out)>0) rs.push({n:i+1,inp:inp,out:out});
    });
    var need=vec(state.target);
    if(state.mode==='target' && !sum(need)){ statusEl.textContent='Fill in the target recipe first.'; return; }
    solveBtn.disabled=true; statusEl.textContent='Searching…';
    runSolve([start,rs,state.mode,CAP,need]).then(function(sol){
      solveBtn.disabled=false; statusEl.textContent='';
      var note=rs.length+' of 4 recipes in use.';
      renderResult(start,sol,need);
      if(sol.steps.length) statusEl.textContent=note;
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('input[name="mode"]'),function(r){
    r.addEventListener('change',function(){
      state.mode=r.value; closePicker(); syncMode(); invalidate(); save();
    });
  });
  load();
  $('mode-'+state.mode).checked=true;
  $('view-'+state.view).checked=true;
  syncMode();
  renderFeeder();
  syncView();
})();
</script>

</body></html>
